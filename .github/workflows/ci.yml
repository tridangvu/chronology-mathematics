name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.2'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Ensure drafts and math-qa absent from dist
        run: |
          if [ -e dist/math-qa ] || [ -e dist/math-qa.html ]; then
            echo "math-qa should not ship" >&2
            exit 1
          fi
          if find dist -iname '*wilson*' | grep -q .; then
            echo "draft article leaked into dist" >&2
            exit 1
          fi
          test -f dist/index.html
          test -d dist/pagefind
